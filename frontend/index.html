<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Star Battle Editor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>" />
  </head>
  <body>
    <header>
      <h1>Star Battle Editor</h1>
    </header>
    <main>
      <section id="toolbar" class="toolbar">
        <div class="group tabs" role="group" aria-label="Mode">
          <button id="mode-edit" type="button">Edit</button>
          <button id="mode-solve" type="button">Solve</button>
        </div>
        <label>Size <select id="size"></select></label>
        <label>
          Stars
          <select id="stars">
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </label>
        <label class="toggle"><input id="auto-mark" type="checkbox" checked /> Auto-mark</label>
        <div class="group">
          <button id="undo" type="button">Undo</button>
          <button id="redo" type="button">Redo</button>
        </div>
        <button id="share" type="button">Copy link</button>
        <button id="check" type="button" class="primary">Check constraints</button>
        <button id="reshape" type="button" title="Reshape unlocked regions until the puzzle has one solution">Find unique</button>
      </section>
      <div class="layout">
        <ul id="help" class="help" aria-label="Controls"></ul>
        <div class="board-column">
          <div id="board" class="grid board"></div>
          <p id="status" class="status"></p>
          <div id="board-actions" class="group board-actions">
            <button id="clear-marks" type="button">Clear marks</button>
            <button id="clear-regions" type="button">Clear regions</button>
          </div>
        </div>
        <aside id="results" class="results" hidden></aside>
      </div>
    </main>
    <div id="color-picker" class="picker" role="dialog" aria-label="Region color" hidden></div>
    <dialog id="resize-dialog">
      <form method="dialog">
        <p id="resize-text"></p>
        <label>
          Rows
          <select id="resize-v">
            <option value="bottom">Bottom</option>
            <option value="top">Top</option>
            <option value="both">Both sides</option>
          </select>
        </label>
        <label>
          Columns
          <select id="resize-h">
            <option value="right">Right</option>
            <option value="left">Left</option>
            <option value="both">Both sides</option>
          </select>
        </label>
        <menu>
          <button value="cancel">Cancel</button>
          <button value="apply" class="primary">Apply</button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
